services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: prontopaga-api
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - NODE_ENV=production
      - JWT_ACCESS_SECRET=supersecret_access_key_prontopaga_change_in_production
      - JWT_REFRESH_SECRET=supersecret_refresh_key_prontopaga_change_in_production
      - JWT_ACCESS_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - CORS_ORIGIN=http://localhost:5173
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: prontopaga-web
    ports:
      - '5173:80'
    depends_on:
      - api
    restart: unless-stopped
